name: Log TradingView signal

on:
  repository_dispatch:
    types: [tv_signal]

permissions:
  contents: write

concurrency:
  group: signals-log
  cancel-in-progress: false

jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Append signal to signals/signals.csv
        env:
          P: ${{ toJson(github.event.client_payload) }}
        run: |
          mkdir -p signals
          f=signals/signals.csv
          [ -f "$f" ] || echo "time,symbol,timeframe,action,price,sl,tp1,tp2,tp3" > "$f"
          echo "$P" | jq -r '[.time,.symbol,.timeframe,.action,.price,.sl,.tp1,.tp2,.tp3] | @csv' >> "$f"
          echo "### New signal" >> "$GITHUB_STEP_SUMMARY"
          echo "$P" | jq . >> "$GITHUB_STEP_SUMMARY"

      - name: Commit
        env:
          P: ${{ toJson(github.event.client_payload) }}
        run: |
          git config user.name  "fibo-trend-bot"
          git config user.email "actions@users.noreply.github.com"
          git add signals/signals.csv
          msg=$(echo "$P" | jq -r '"signal: \(.action) \(.symbol) @ \(.price)"')
          git commit -m "$msg" || exit 0
          git push
